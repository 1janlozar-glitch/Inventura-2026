<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Popis">
<title>Popis inventure</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#222831;--line:#2d3540;--text:#eef1f4;--muted:#9aa4b0;--accent:#2f8cff;--ok:#2fbf71;--warn:#f0b429;--bad:#ef5a5a;--input:#0b0e11;--okText:#04210f;color-scheme:dark}
:root[data-theme=light]{--bg:#eef1f5;--card:#ffffff;--card2:#f1f3f7;--line:#d3d9e1;--text:#121820;--muted:#5b6674;--accent:#1d6fe5;--ok:#15954a;--warn:#b26a00;--bad:#d42a2a;--input:#ffffff;--okText:#ffffff;color-scheme:light}
:root[data-theme=light] #toast{color:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;max-width:680px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
@media (max-width:700px){body{border:0}}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--card)}
header .who{flex:1;min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;padding:6px 0}
header .who b{color:var(--text)}
.sync{font-size:13px;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.sync.ok{color:var(--ok)}.sync.pend{color:var(--warn)}.sync.err{color:var(--bad)}
main{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{display:flex}
nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--card)}
nav button{flex:1;padding:8px 2px 10px;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav button .ni{font-size:21px;line-height:1.1}
nav .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800;line-height:20px;text-align:center}
.themeBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:18px;flex:none}
#login .themeBtn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.excl{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;font-weight:900;font-size:15px;line-height:22px;text-align:center;margin-right:8px;vertical-align:middle}
.card.redo{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.redonote{color:var(--bad);font-weight:700;font-size:14px;margin-top:6px}
@media (max-width:380px){.btn{font-size:16px;padding:0 12px}nav button{font-size:11px}nav button .ni{font-size:19px}h2{font-size:18px}}
nav button.active{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{min-height:56px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:17px;font-weight:600}
.btn:active{filter:brightness(1.2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--okText)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:42px;font-size:15px;padding:0 12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
input,select,textarea{font:inherit;font-size:18px;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:64px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.pad{padding:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}
h2{font-size:20px;margin:4px 0 8px}
/* login */
#login{position:relative}
#login .wrap{max-width:420px;margin:auto;width:100%;padding:24px 20px}
#login h1{font-size:26px;margin:0 0 4px}
/* scan */
#readerWrap{position:relative;background:#000;flex:none}
#reader{width:100%;max-height:48vh;overflow:hidden}
#reader video{display:block}
#camMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:15px;pointer-events:none}
#camMsg:empty{display:none}
#pausedHint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.75);border:1px solid var(--line);color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;white-space:nowrap}
#torchBtn{position:absolute;right:10px;top:10px;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;font-size:20px}
#torchBtn.on{background:var(--warn);color:#000}
.panel{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
#aiBtn{position:absolute;left:10px;top:10px;height:46px;padding:0 14px;border-radius:23px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:600}
#camBar{display:none}
.nocam #readerWrap,.nocam #camBar{display:none!important}   /* brez kamere: iskanje po šifri in opisu */
#scan.compact #readerWrap{display:none}
#scan.compact #camBar{display:block}
.sugg{display:flex;flex-direction:column;gap:6px}
.sugg:empty{display:none}
.sugg .s{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text)}
.sugg .s:active,.card.tap:active{border-color:var(--accent)}
.sugg .s .r1{display:flex;justify-content:space-between;gap:10px}
.sugg .s .r2{font-size:14px;opacity:.85;margin-top:2px}
.sugg .hint{font-size:13px;color:var(--muted)}
#linkBox{background:rgba(240,180,41,.1);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}
#linkBox .row{margin-top:8px;gap:8px}
#linkBox .btn{flex:1}
.linknote{color:var(--warn);font-size:14px;margin-top:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.role{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:16px 10px;text-align:center;color:var(--text)}
.role b{display:block;font-size:18px;margin-top:6px}
.role small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.role .ic{font-size:30px}
.role.active{border-color:var(--accent);background:rgba(47,140,255,.14)}
.role.vp.active{border-color:var(--ok);background:rgba(47,191,113,.14)}
.rolebadge{font-size:11px;font-weight:800;letter-spacing:.5px;padding:2px 7px;border-radius:6px;margin-left:6px;background:var(--ok);color:#04210f;vertical-align:middle}
#ocrBtn{width:100%;min-height:60px;font-size:18px}
#ocrCam{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column}
#ocrCam video{flex:1;width:100%;object-fit:cover;min-height:0}
#ocrCam .frame{position:absolute;left:5%;right:5%;top:22%;height:40%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#ocrCam .hint{position:absolute;left:0;right:0;top:calc(22% - 44px);text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000;padding:0 16px}
#ocrCam .bar{display:flex;gap:10px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#000}
#ocrCam .bar .btn{flex:1;min-height:64px;font-size:19px}
#ocrCam .bar #ocrClose{flex:0 0 30%}
#ocrMsg{position:absolute;left:5%;right:5%;top:64%;color:#fff;text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
#ocrRead{font-size:13px;color:var(--muted);word-break:break-word}
#rcBanner{display:block;width:100%;text-align:left;background:rgba(240,180,41,.12);border:1px solid var(--warn);color:var(--text);border-radius:12px;padding:12px 14px;font-weight:600}
.card.rc{border-color:var(--warn);background:rgba(240,180,41,.07)}
.card.ok{border-color:rgba(47,191,113,.5)}
.rcnote{color:var(--warn);font-size:14px;margin-top:4px}
.okmark{color:var(--ok);font-weight:700;white-space:nowrap}
.cnts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cnts span{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:13px}
.vbtns{display:flex;gap:8px;margin-top:10px}
.vbtns .btn{flex:1;min-height:46px;font-size:14px;padding:0 8px;white-space:nowrap}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.ord{color:var(--muted);font-size:13px;margin-right:6px;font-weight:400}
.badge.rcd{background:rgba(47,140,255,.15);color:var(--accent)}
#itReview{font-size:14px;margin-top:6px;padding:8px 10px;border-radius:10px}
#itReview.rc{background:rgba(240,180,41,.12);color:var(--warn)}
#itReview.done{background:rgba(47,191,113,.12);color:var(--ok)}
mark{background:rgba(47,140,255,.3);color:inherit;border-radius:3px;padding:0 1px}
.cnt{font-size:13px;color:var(--ok);white-space:nowrap}
.card.tap{cursor:pointer}
.coderow{display:flex;gap:8px}
.coderow input{font-size:22px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.coderow input::placeholder{text-transform:none;font-weight:500;font-size:18px}
.coderow .btn{flex:none;min-width:104px}
#preview{font-size:14px;min-height:20px}
#preview .known{color:var(--ok)}#preview .new{color:var(--warn)}
.last{display:flex;flex-direction:column;gap:6px}
.last .it{display:flex;justify-content:space-between;gap:8px;background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.last .it span:last-child{white-space:nowrap}
.last .it span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* item */
.codebig{font-size:26px;font-weight:700;word-break:break-all}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.badge.known{background:rgba(47,191,113,.15);color:var(--ok)}
.badge.new{background:rgba(240,180,41,.15);color:var(--warn)}
.badge.ai{background:rgba(47,140,255,.15);color:var(--accent)}
.qtyrow{display:flex;gap:8px}
#itQty{font-size:34px;font-weight:700;text-align:center;padding:10px}
.qtybtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.qtybtns .btn{min-height:50px;padding:0}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
/* list + overview */
.toolbar{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 16px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.summary{font-size:14px;color:var(--muted)}
.items{padding:8px 16px 24px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.card .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .r1 b{word-break:break-all}
.card .qty{font-size:18px;font-weight:700;white-space:nowrap}
.card .r2{font-size:14px;color:var(--text);opacity:.85;margin-top:2px}
.card .r3{font-size:12px;color:var(--muted);margin-top:4px}
.card.warn{border-color:var(--warn)}
.diff.plus{color:var(--ok)}.diff.minus{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.pend{background:var(--warn)}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;min-height:44px;font-size:14px;white-space:nowrap;padding:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-weight:600}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.filters input{font-size:15px;padding:10px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
/* modal, toast, busy */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal .box{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}
.modal h3{margin:0 0 10px;font-size:19px}
.modal .mbody p{margin:6px 0}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a313b;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:60;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.4);transition:opacity .2s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
#toast.ok{background:#14532d}#toast.bad{background:#7f1d1d}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:70;color:#fff;font-size:17px}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body class="nocam">

<header id="hdr" class="hidden">
  <button class="who" id="whoBtn"></button>
  <span class="sync" id="syncBadge">…</span>
  <button class="themeBtn" id="themeBtn" title="Dan / noč" aria-label="Dan / noč">🌙</button>
</header>

<main>
  <!-- PRIJAVA -->
  <section class="screen" id="login">
    <button class="themeBtn" id="themeBtn2" title="Dan / noč" aria-label="Dan / noč">🌙</button>
    <div class="wrap">
      <h1>Popis inventure</h1>
      <div class="roles">
        <button class="role active" data-role="popis"><span class="ic">📦</span><b>Popisovalec</b><small>štejem artikle</small></button>
        <button class="role vp" data-role="vpis"><span class="ic">✍️</span><b>Vpisovalec</b><small>pregledam in vnesem v ERP</small></button>
      </div>
      <label for="lgName">Vaše ime</label>
      <input id="lgName" autocomplete="name" placeholder="npr. Janez">
      <label for="lgPin" id="lgPinLbl">PIN ekipe</label>
      <input id="lgPin" type="password" inputmode="numeric" autocomplete="off">
      <label for="lgPopis">Popis</label>
      <input id="lgPopis" list="popisList" autocomplete="off">
      <datalist id="popisList"></datalist>
      <button class="btn primary wide" id="lgBtn" style="margin-top:22px">Začni popis</button>
    </div>
  </section>

  <!-- SKENIRANJE -->
  <section class="screen" id="scan">
    <div id="readerWrap">
      <div id="reader"></div>
      <div id="camMsg"></div>
      <div id="pausedHint" class="hidden">Tapnite sliko za novo skeniranje</div>
      <button id="torchBtn" title="Svetilka" aria-label="Svetilka">&#128294;</button>
      <button id="aiBtn" title="Preberi nalepko z AI">AI nalepka</button>
    </div>
    <div class="panel">
      <button id="rcBanner" class="hidden"></button>
      <button class="btn" id="camBar">&#128247; Skeniraj s kamero</button>
      <button class="btn primary hidden" id="ocrBtn">📷 Slikaj nalepko</button>
      <div id="ocrRead" class="hidden"></div>
      <div id="linkBox" class="hidden"></div>
      <div class="coderow">
        <input id="codeIn" placeholder="Šifra ali del opisa" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go">
        <button class="btn primary" id="confirmBtn">Potrdi</button>
      </div>
      <div id="preview"></div>
      <div class="sugg" id="sugg"></div>
      <div class="last" id="lastList"></div>
    </div>
  </section>

  <!-- ARTIKEL IN KOLIČINA -->
  <section class="screen" id="item">
    <div class="pad">
      <div class="muted" style="font-size:13px">Koda artikla</div>
      <div><span class="codebig" id="itCode"></span><span id="itBadges"></span></div>
      <div class="muted" id="itEan" style="font-size:13px"></div>
      <div class="linknote hidden" id="itLink"></div>
      <div id="itReview" class="hidden"></div>
      <div class="muted" id="itBook" style="font-size:14px;margin-top:4px"></div>

      <label for="itMfr">Proizvajalec</label>
      <input id="itMfr" list="mfrList" autocomplete="off">
      <datalist id="mfrList"></datalist>

      <label for="itDesc">Opis</label>
      <textarea id="itDesc" rows="2"></textarea>

      <div class="row" style="gap:10px">
        <div class="grow">
          <label for="itQty">Količina</label>
          <input id="itQty" inputmode="decimal" autocomplete="off" enterkeyhint="done">
        </div>
        <div style="width:118px">
          <label for="itUnit">Enota</label>
          <select id="itUnit">
            <option>kos</option><option>m</option><option>kolut</option><option>paket</option><option>kpl</option><option>kg</option><option>l</option>
          </select>
        </div>
      </div>
      <div class="qtybtns">
        <button class="btn" data-add="-1">−1</button>
        <button class="btn" data-add="1">+1</button>
        <button class="btn" data-add="5">+5</button>
        <button class="btn" data-add="10">+10</button>
      </div>
      <div class="muted" id="itLoc" style="font-size:13px;margin-top:12px"></div>
      <div class="actions">
        <button class="btn" id="itCancel">Prekliči</button>
        <button class="btn ok" id="itSave">Shrani</button>
      </div>
    </div>
  </section>

  <!-- POPISNI LIST -->
  <section class="screen" id="plist">
    <div class="toolbar">
      <input id="plSearch" placeholder="Išči šifro, opis ali proizvajalca" autocomplete="off" spellcheck="false" style="font-size:16px;padding:10px 12px">
      <div class="tabs" id="plTabs">
        <button data-f="all" class="active">Vsi</button>
        <button data-f="todo">Nepopisani</button>
        <button data-f="done">Popisani</button>
        <button data-f="rc" id="plRcTab" class="hidden">Ponovno</button>
      </div>
      <div class="summary" id="plSummary"></div>
    </div>
    <div class="items" id="plItems"></div>
  </section>

  <!-- VPIS (vpisovalec) -->
  <section class="screen" id="vpis">
    <div class="toolbar">
      <div class="row">
        <input id="vpSearch" class="grow" placeholder="Išči šifro ali opis" autocomplete="off" style="font-size:16px;padding:10px 12px">
        <button class="btn small primary" id="vpRefresh">Osveži</button>
      </div>
      <div class="tabs" id="vpTabs">
        <button data-f="todo" class="active">Za vpis</button>
        <button data-f="rc">Ponovno</button>
        <button data-f="done">Zaključeni</button>
      </div>
      <div class="summary" id="vpSummary"></div>
    </div>
    <div class="items" id="vpItems"></div>
  </section>

  <!-- MOJ SEZNAM -->
  <section class="screen" id="list">
    <div class="toolbar">
      <div class="row">
        <input id="listSearch" class="grow" placeholder="Išči šifro ali opis" style="font-size:16px;padding:10px 12px">
        <button class="btn small" id="listExport">Izvozi</button>
      </div>
      <div class="summary" id="listSummary"></div>
    </div>
    <div class="items" id="listItems"></div>
  </section>

  <!-- PREGLED -->
  <section class="screen" id="overview">
    <div class="toolbar">
      <div class="row">
        <button class="btn small primary grow" id="ovRefresh">Osveži</button>
        <button class="btn small" id="ovExport">Izvozi vse</button>
      </div>
      <div class="row">
        <button class="btn small grow" id="ovImport">Naloži popisni list (Excel)</button>
        <button class="btn small danger" id="ovClear">Izbriši</button>
      </div>
      <button class="btn small danger wide hidden" id="ovReset">⟲ Začni inventuro znova</button>
      <div class="tabs" id="ovTabs">

/* ================= LOKALNA BAZA (IndexedDB) ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('popis-inventure', 2);
      r.onupgradeneeded = () => {
        const d = r.result, has = n => d.objectStoreNames.contains(n);
        if (!has('entries')) d.createObjectStore('entries', { keyPath: 'id' });
        if (!has('articles')) { const a = d.createObjectStore('articles', { keyPath: 'code' }); a.createIndex('ean', 'ean', { unique: false }); }
        if (!has('outbox_art')) d.createObjectStore('outbox_art', { keyPath: 'code' });
        if (!has('kv')) d.createObjectStore('kv');
        if (!has('aliases')) d.createObjectStore('aliases', { keyPath: 'alias' });      // povezane kode → ERP šifra
        if (!has('outbox_alias')) d.createObjectStore('outbox_alias', { keyPath: 'alias' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, k) { return this.req(s, 'readonly', st => st.get(k)); },
  all(s) { return this.req(s, 'readonly', st => st.getAll()); },
  put(s, v) { return this.req(s, 'readwrite', st => st.put(v)); },
  del(s, k) { return this.req(s, 'readwrite', st => st.delete(k)); },
  count(s) { return this.req(s, 'readonly', st => st.count()); },
  byEan(ean) { return this.req('articles', 'readonly', st => st.index('ean').get(ean)); },
  putMany(s, vals) {
    return new Promise((res, rej) => { const t = this.db.transaction(s, 'readwrite'); const st = t.objectStore(s); vals.forEach(v => st.put(v)); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  },
  clear(s) { return this.req(s, 'readwrite', st => st.clear()); },
  kvGet(k) { return this.req('kv', 'readonly', st => st.get(k)); },
  kvSet(k, v) { return this.req('kv', 'readwrite', st => st.put(v, k)); }
};

    throw new Error(m || ('HTTP ' + r.status));

}

let scanner = null, scanRunning = false, scanPaused = false, torchOn = false, lastScan = { text: '', t: 0 };
// Zagon in ustavitev kamere se izvajata eden za drugim (brez prekrivanja)
let scanOp = Promise.resolve();
function startScanner() { scanOp = scanOp.then(_startScanner).catch(() => {}); return scanOp; }
function stopScanner() { scanOp = scanOp.then(_stopScanner).catch(() => {}); return scanOp; }
function setPausedUI(p) { $('#pausedHint').classList.toggle('hidden', !p); }
async function _startScanner() {
  if (curScreen !== 'scan') return;
  if (scanRunning) { if (scanPaused && !$('#codeIn').value) resumeScanner(); return; }
  if (!window.Html5Qrcode) { $('#camMsg').textContent = 'Knjižnica za skeniranje se ni naložila. Preverite internet in znova odprite aplikacijo. Kodo lahko vpišete ročno.'; return; }
  try {
    if (!scanner) {
      const F = Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        verbose: false,
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93, F.ITF, F.QR_CODE, F.DATA_MATRIX],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true }
      });
    }
    $('#camMsg').textContent = '';
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, aspectRatio: 1.3333, qrbox: (w, h) => ({ width: Math.max(160, Math.floor(w * 0.85)), height: Math.max(100, Math.floor(h * 0.55)) }) },
      onScan, () => {});
    scanRunning = true; scanPaused = false; torchOn = false; $('#torchBtn').classList.remove('on'); setPausedUI(false);
    let caps = {}; try { caps = scanner.getRunningTrackCapabilities() || {}; } catch {}
    $('#torchBtn').classList.toggle('hidden', !caps.torch);
    if (curScreen !== 'scan' && curScreen !== 'item') await _stopScanner();
  } catch (e) {
    $('#camMsg').textContent = 'Kamera ni dostopna (' + (e && e.message ? e.message : e) + '). Dovolite kamero v brskalniku ali kodo vpišite ročno.';
  }
}
async function _stopScanner() {
  const was = scanRunning;
  scanRunning = false; scanPaused = false; torchOn = false; setPausedUI(false); $('#torchBtn').classList.remove('on');
  if (scanner && was) { try { await scanner.stop(); } catch {} }
}
function pauseScanner() { if (scanRunning && !scanPaused) { try { scanner.pause(true); scanPaused = true; setPausedUI(true); } catch {} } }
function resumeScanner() { if (scanRunning && scanPaused) { try { scanner.resume(); scanPaused = false; setPausedUI(false); } catch {} } }

// Najde ERP artikel po šifri, EAN ali povezani kodi (kataloška številka, druga črtna koda)
async function findArticle(code, alt) {
  for (const c0 of [code, alt]) {
    if (!c0) continue;
    const c = String(c0).trim();
    const a = await DB.get('articles', c); if (a) return a;
    const up = c.toUpperCase(); if (up !== c) { const u = await DB.get('articles', up); if (u) return u; }
    // EAN: v Excelu se vodilne ničle pogosto izgubijo
    const eans = /^\d{8,14}$/.test(c) ? [...new Set([c, c.replace(/^0+/, ''), c.padStart(13, '0'), c.padStart(14, '0')])] : [c];
    for (const e of eans) { const b = await DB.byEan(e); if (b) return b; }

// Artikli, katerih ERP šifra ali opis VSEBUJE skenirano kodo (npr. šifra SE-A9F74116, opis »… A9F74116«)
async function findContaining(raw, limit = 30) {
  let k = skey(raw); if (/^\d+$/.test(k)) k = k.replace(/^0+/, '') || k;
  if (k.length < 4) return [];
  const out = [];
  for (const x of await artIndex()) {
    if (x.ck.includes(k) || (k.length >= 5 && x.hk.includes(k))) { out.push(x.a); if (out.length >= limit) break; }
  }
  // najprej tisti, ki imajo kodo v šifri, nato po dolžini šifre

/* ---------- Pametni iskalnik (delni zadetki) ---------- */
const skey = s => norm(s).replace(/ /g, '');

function invalidateArts() { ART = null; }
async function artIndex() {
  if (!ART) {
    const al = new Map();
    (await DB.all('aliases')).forEach(x => { if (!al.has(x.code)) al.set(x.code, []); al.get(x.code).push(x.raw || x.alias); });
    ART = (await DB.all('articles')).map(a => {
      const alias = al.get(a.code) || [];
      const txt = [a.code, a.ean, a.manufacturer, a.description, ...alias].filter(Boolean).join(' ');
      return { a, ck: skey(a.code), ek: skey(a.ean), ak: alias.map(skey), hay: norm(txt), hk: skey(txt),
        cc: ckey(a.code), ce: ckey(a.ean), ca: alias.map(ckey), hc: ckey(txt) };
    }).sort((x, y) => (x.a.sort_order ?? 1e9) - (y.a.sort_order ?? 1e9) || x.a.code.localeCompare(y.a.code)); // vrstni red popisnega lista
  }

// OCR pogosto zamenja podobne znake – za primerjavo jih poenotimo
function ckey(s) { return skey(s).replace(/o/g, '0').replace(/[il]/g, '1').replace(/s/g, '5').replace(/b/g, '8').replace(/z/g, '2'); }
// Ali se niza razlikujeta za največ en znak (manjkajoč, odvečen ali zamenjan)
function near1(a, b) {
  if (a === b) return true;
  const la = a.length, lb = b.length; if (Math.abs(la - lb) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < la && j < lb) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++d > 1) return false;
    if (la > lb) i++; else if (lb > la) j++; else { i++; j++; }
  }
  return d + (la - i) + (lb - j) <= 1;
}
// Iz prebranih besed z nalepke poišče najverjetnejše artikle
async function ocrMatch(words) {
  const toks = [];
  const clean = w => String(w || '').replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
  const ws = words.map(w => ({ t: clean(w.text), c: w.confidence ?? 90 })).filter(w => w.t);
  ws.forEach((w, i) => {
    const codeLike = t => (t.match(/\d/g) || []).length >= 2 && ckey(t).length >= 4 && !/^\d[-.]?[a-zčšž]{3,}$/i.test(t);
    if (codeLike(w.t)) toks.push(w.t);
    const n = ws[i + 1];                                           // »LC1D 18BL« -> »LC1D18BL«
    if (n && w.t.length <= 7 && n.t.length <= 7 && (w.t + n.t).replace(/\D/g, '').length >= 2 && ckey(w.t + n.t).length >= 5) toks.push(w.t + n.t);
  });
  const uniq = [...new Map(toks.map(t => [ckey(t), t])).entries()];   // [ključ, izvirnik]
  const textWords = [...new Set(ws.map(w => norm(w.t)).filter(t => t.length >= 4 && !/\d/.test(t)))];
  const out = [];
  for (const x of await artIndex()) {
    let sc = 0, tok = null, exact = false;
    for (const [k, raw] of uniq) {
      let v = 0, ex = false;
      if (k === x.cc || (x.ce && k === x.ce) || x.ca.includes(k)) { v = 100 + k.length; ex = true; }
      else if (k.length >= 5 && (x.cc.includes(k) || (x.cc.length >= 5 && k.includes(x.cc)) || x.ca.some(a => a.length >= 5 && (a.includes(k) || k.includes(a))))) v = 45 + k.length;
      else if (k.length >= 6 && x.hc.includes(k)) v = 30 + k.length;
      else if (k.length >= 6 && (near1(k, x.cc) || x.ca.some(a => near1(k, a)))) v = 60 + k.length;   // ena napačna črka/številka
      if (v > 0) { sc += v; if (!tok || v > 60) { tok = raw; exact = exact || ex; } }
    }
    if (!sc) continue;
    sc += textWords.filter(t => x.hay.includes(t)).length * 3;      // ujemanje besed opisa
    out.push({ a: x.a, sc, tok, exact });
  }
  out.sort((p, q) => q.sc - p.sc || p.a.code.length - q.a.code.length);

}
function matchScore(x, qk, toks) {
  if (x.ck === qk || (x.ek && x.ek === qk) || x.ak.includes(qk)) return 100;
  if (x.ak.some(k => k.startsWith(qk))) return 85;
  if (x.ck.startsWith(qk)) return 90 - Math.min(20, x.ck.length - qk.length) / 2;
  if (x.ek && x.ek.startsWith(qk)) return 75;
  if (x.ck.includes(qk)) return 65;
  if (toks.length && toks.every(t => x.hay.includes(t))) return 50 + (x.hay.startsWith(toks[0]) ? 5 : 0);
  if (qk.length >= 3 && x.hk.includes(qk)) return 40;

}
async function searchArts(q, limit = 8) {
  const qn = norm(q), qk = qn.replace(/ /g, ''), toks = qn.split(' ').filter(Boolean);
  const list = await artIndex();
  if (!qk) return list.slice(0, limit).map(x => x.a);
  const out = [];
  for (const x of list) { const s = matchScore(x, qk, toks); if (s) out.push([s, x.a]); }
  out.sort((a, b) => b[0] - a[0] || a[1].code.localeCompare(b[1].code));
  return out.slice(0, limit).map(r => r[1]);
}
// označi del besedila, ki se ujema z iskanjem
function hl(text, q) {
  text = String(text ?? ''); const t = esc(text); const qn = norm(q); if (!qn) return t;
  const plain = text.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  for (const tok of [qn.replace(/ /g, ''), ...qn.split(' ')].filter(x => x.length >= 2)) {
    const i = plain.indexOf(tok);
    if (i >= 0) return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + tok.length)) + '</mark>' + esc(text.slice(i + tok.length));
  }
  return t;
}
async function myQtyMap() {

}

/* ================= SLIKAJ NALEPKO (branje besedila, brez črtnih kod) ================= */
let ocrStream = null, ocrWorker = null, ocrWorkerP = null;
function ocrLoad() {
  if (ocrWorkerP) return ocrWorkerP;
  if (!window.Tesseract) return Promise.reject(new Error('bralnik besedila se ni naložil (preverite internet)'));
  ocrWorkerP = Tesseract.createWorker('eng', 1, {
    logger: m => { if (m.status && !$('#ocrCam').classList.contains('hidden') && /load|initializ/i.test(m.status)) $('#ocrMsg').textContent = 'Prvič nalagam bralnik besedila … ' + Math.round((m.progress || 0) * 100) + ' %'; }
  }).then(async w => { await w.setParameters({ tessedit_pageseg_mode: '11', preserve_interword_spaces: '1' }); ocrWorker = w; return w; })
    .catch(e => { ocrWorkerP = null; throw e; });
  return ocrWorkerP;
}
async function ocrOpen() {
  $('#ocrMsg').textContent = ''; $('#ocrCam').classList.remove('hidden');
  try {
    ocrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('#ocrVideo').srcObject = ocrStream; await $('#ocrVideo').play().catch(() => {});
  } catch (e) { $('#ocrMsg').textContent = 'Kamera ni dostopna: ' + (e.message || e) + '. Dovolite kamero v brskalniku.'; }
  ocrLoad().catch(() => {});                                          // bralnik se nalaga, medtem ko ciljate
}
function ocrClose() {
  if (ocrStream) ocrStream.getTracks().forEach(t => t.stop()); ocrStream = null;
  $('#ocrVideo').srcObject = null; $('#ocrCam').classList.add('hidden');
}
function ocrCapture() {
  const v = $('#ocrVideo'), vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  // izrez, ki približno ustreza okvirju na zaslonu (sredina slike)
  const cw = vw * 0.9, ch = vh * 0.5, sx = (vw - cw) / 2, sy = vh * 0.2;
  const sc = Math.min(2, 1600 / cw), c = document.createElement('canvas');
  c.width = Math.round(cw * sc); c.height = Math.round(ch * sc);
  const g = c.getContext('2d'); g.filter = 'grayscale(1) contrast(1.4)';
  g.drawImage(v, sx, sy, cw, ch, 0, 0, c.width, c.height);
  return c;
}
$('#ocrBtn').onclick = ocrOpen;
$('#ocrClose').onclick = ocrClose;
$('#ocrShot').onclick = async () => {
  const c = ocrCapture(); if (!c) return toast('Kamera še ni pripravljena', 'bad');
  $('#ocrMsg').textContent = 'Berem nalepko …'; $('#ocrShot').disabled = true;
  try {
    const w = await ocrLoad();
    const { data } = await w.recognize(c);
    const words = (data.words && data.words.length ? data.words : (data.text || '').split(/\s+/).map(t => ({ text: t })));
    ocrClose(); await ocrResult(words);
  } catch (e) { $('#ocrMsg').textContent = 'Branje ni uspelo: ' + (e.message || e); }
  finally { $('#ocrShot').disabled = false; }
};
async function ocrResult(words) {
  const { list, tokens } = await ocrMatch(words);
  const read = words.map(w => w.text).join(' ').replace(/\s+/g, ' ').trim();
  const top = list[0], second = list[1];
  // en sam zanesljiv zadetek -> takoj na vnos količine
  const sure = top && ((top.exact && !(second && second.exact))                 // točna šifra/kataloška številka
    || (top.sc >= 100 && (!second || second.sc < top.sc * 0.6)) || (top.sc >= 50 && !second));
  if (sure) {
    S.method = 'ocr';
    if (!top.exact && top.tok) S.link = { raw: top.tok, auto: true };
    return openItem(top.a.code, null);
  }
  clearCode(); setCompact(true);
  $('#ocrRead').textContent = read ? 'Prebrano: ' + read.slice(0, 160) : 'Na sliki ni bilo mogoče prebrati besedila.';
  $('#ocrRead').classList.remove('hidden');
  if (list.length) {
    // več možnosti: koda se NE poveže samodejno (delna koda bi kasneje vodila na napačen artikel)
    renderSuggList(list.map(m => m.a), list[0].tok || '', `Najverjetnejši artikli (${list.length}) – tapnite pravega:`);
  } else {
    toast('Šifre na nalepki ni bilo mogoče prepoznati – vpišite jo ročno', 'bad');
    $('#codeIn').value = tokens[0] || ''; if (tokens[0]) lookupPreview(tokens[0]);
    $('#codeIn').focus();
  }
}

async function setReview(code, status, note, target) {
  const old = REV.get(code) || {};
  if (status) REV.set(code, { ...old, code, status, by_name: S.name,
    note: status === 'recount' ? note || null : old.note, target: status === 'recount' ? target || null : old.target, updated_at: nowIso() });
  else REV.delete(code);
  await DB.kvSet('rev:' + S.popis, [...REV.values()]); updateRcUI();
  const job = { popis: S.popis, code, status: status || null, note: note || null, target: target || null, by: S.name };
  try { await sendReview(job); return true; }
  catch (e) {
    if (/Napačen PIN/.test(e.message)) throw e;
    if (/samo vpisovalec/.test(e.message)) { toast(e.message, 'bad'); pullReviews().catch(() => {}); return false; }
    const q = (await DB.kvGet('revOut')) || []; q.push(job); await DB.kvSet('revOut', q); updateBadge(); return false;
  }
}

const VP = { f: 'todo', entries: [], loaded: false, busy: false };
async function loadVpis(withSpinner) {
  if (VP.busy) return; VP.busy = true;
  if (!navigator.onLine) { VP.busy = false; toast('Vpis potrebuje internet', 'bad'); return renderVpis(); }
  if (withSpinner) busy(true, 'Nalagam popis …');
  try {
    await sync(); await sync();
    VP.entries = (await rpc('get_entries', { p_pin: S.pin, p_popis: S.popis })) || [];
    await pullReviews().catch(e => { if (!/Napačen PIN/.test(e.message)) toast('V Supabase zaženite posodobitev-4.sql', 'bad'); });
    VP.loaded = true;
  } catch (e) { toast('Nalaganje ni uspelo: ' + e.message, 'bad'); }
  finally { busy(false); VP.busy = false; }
  renderVpis();
}
async function vpisRows() {
  const idx = await artIndex();
  const g = new Map();
  VP.entries.forEach(e => {
    if (!g.has(e.code)) g.set(e.code, { qty: 0, unit: e.unit || '', by: new Map(), last: '', e });
    const x = g.get(e.code); x.qty = round(x.qty + Number(e.quantity));
    const nk = nameNice(e.counter); x.by.set(nk, round((x.by.get(nk) || 0) + Number(e.quantity)));   // JAN in Jan = ista oseba
    if ((e.updated_at || '') > x.last) x.last = e.updated_at || '';
  });
  const rows = idx.map((x, i) => ({ a: x.a, pos: x.a.sort_order ?? (i + 1), g: g.get(x.a.code), rv: REV.get(x.a.code) }));
  const known = new Set(idx.map(x => x.a.code));
  [...g.keys()].filter(c => !known.has(c)).sort().forEach(c => {          // artikli, ki jih ni na popisnem listu
    const e = g.get(c).e; rows.push({ a: { code: c, manufacturer: e.manufacturer, description: e.description, unit: e.unit }, pos: '', g: g.get(c), rv: REV.get(c) });
  });
  return rows;
}

async function loadOverview(silent) {

async function articleMap() { const m = new Map(); (await DB.all('articles')).forEach(a => m.set(a.code, a)); return m; }
function duplicates(entries) {
  const g = new Map();
  entries.forEach(e => { if (!e.location) return; // dvojno štetje se preverja le, kjer so vpisane lokacije
    const k = e.code + '|' + (e.location || ''); if (!g.has(k)) g.set(k, new Set()); g.get(k).add(e.counter); });
  const d = new Set(); g.forEach((s, k) => { if (s.size > 1) d.add(k); }); return d;
}
function groupByArticle(entries, arts) {
  const g = new Map();
  entries.forEach(e => {
    if (!g.has(e.code)) { const a = arts.get(e.code); g.set(e.code, { code: e.code, ean: e.ean || (a && a.ean) || '', manufacturer: (a && a.manufacturer) || e.manufacturer || '',
      description: (a && a.description) || e.description || '', unit: e.unit || (a && a.unit) || '', qty: 0, book: a && a.book_qty !== null && a.book_qty !== undefined ? Number(a.book_qty) : null, locs: new Set(), counters: new Set() }); }
    const x = g.get(e.code); x.qty = round(x.qty + Number(e.quantity)); x.locs.add(e.location || ''); x.counters.add(e.counter);
  });
  return [...g.values()].sort((a, b) => a.code.localeCompare(b.code));
}

  }
  $('#ovItems').innerHTML = html || `<div class="empty">${OV.entries.length ? 'Ni zadetkov.' : 'V tem popisu še ni vnosov.'}</div>`;
}

const COLS = {
  code: ['sifra', 'sifra artikla', 'koda', 'koda artikla', 'code', 'id artikla', 'artikel', 'st artikla', 'art st'],
  alias: ['kataloska stevilka', 'kat st', 'katalog', 'sifra proizvajalca', 'koda proizvajalca', 'sifra dobavitelja', 'dobaviteljeva sifra', 'art st dobavitelja', 'oznaka proizvajalca', 'referenca', 'ref', 'art nr', 'art no', 'artnr', 'article number', 'art nr proizvajalca'],
  ean: ['ean', 'ean koda', 'crtna koda', 'barcode', 'gtin'],
  manufacturer: ['proizvajalec', 'dobavitelj', 'manufacturer', 'znamka', 'brand', 'blagovna znamka'],
  description: ['opis', 'naziv', 'naziv artikla', 'description', 'ime', 'name', 'ime artikla'],

  book_qty: ['zaloga', 'knjizna zaloga', 'kolicina', 'stock', 'stanje', 'kol']
};
function detectCols(headers) {
  const map = {}; const nh = headers.map(h => [h, norm(h)]);
  for (const [key, names] of Object.entries(COLS)) {
    const free = nh.filter(([h]) => !Object.values(map).includes(h));
    let hit = null;
    for (const nm of names) { hit = free.find(([, n]) => n === nm); if (hit) break; }               // točno ime, po prioriteti
    if (!hit) for (const nm of names) { hit = free.find(([, n]) => n.startsWith(nm + ' ')); if (hit) break; }
    if (!hit) for (const nm of names.filter(x => x.length >= 3)) { hit = free.find(([, n]) => n.startsWith(nm)); if (hit) break; }
    if (hit) map[key] = hit[0];
  }
  return map;
}
const cellStr = v => (v === null || v === undefined) ? '' : (typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(v)) : String(v).trim());
const cellEan = v => typeof v === 'number' ? v.toFixed(0) : String(v ?? '').replace(/\D/g, '');
async function readTable(file) {
  const buf = await file.arrayBuffer();
  if (/\.(csv|txt)$/i.test(file.name)) {
    let text = new TextDecoder('utf-8').decode(buf);
    if (text.includes('�')) { try { text = new TextDecoder('windows-1250').decode(buf); } catch {} }
    const first = text.split(/\r?\n/)[0] || '';
    const fs = [';', '\t', ','].sort((a, b) => first.split(b).length - first.split(a).length)[0];
    const wb = XLSX.read(text, { type: 'string', FS: fs, raw: true });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
  }
  const wb = XLSX.read(buf, { type: 'array' });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
}

// Izbriše vse popisane količine in statuse pregleda tega popisa (baza + vsi telefoni). Samo s PIN-om vpisovalca.
async function applyReset(rs) {
  if (!rs) return;
  const key = 'resetVer:' + S.popis, seen = await DB.kvGet(key);
  if (seen === (rs.ver || 0)) return;
  if (!rs.ver) return DB.kvSet(key, 0);
  const at = rs.at ? Date.parse(rs.at) : Infinity;
  for (const e of await DB.all('entries')) if (e.popis === S.popis && Date.parse(e.created_at) <= at) await DB.del('entries', e.id);
  REV = new Map(); await DB.kvSet('rev:' + S.popis, []); await DB.kvSet('revOut', []); await DB.kvSet(key, rs.ver);
  if (seen !== undefined && seen !== null && S.role !== 'vpis') toast(`Inventura je bila začeta znova${rs.by ? ' (' + rs.by + ')' : ''} – prejšnji vnosi so izbrisani`, 'bad');
  updateRcUI(); OV.loaded = false; VP.loaded = false;
  if (curScreen === 'scan') renderLast(); if (curScreen === 'list') renderList(); if (curScreen === 'plist') renderPlist();
}

    busy(false);
    toast(/reset_popis|get_reset|function/i.test(e.message) ? 'Najprej v Supabase zaženite posodobitev-6.sql'
      : /Napačen PIN|samo vpisovalec/.test(e.message) ? 'Napačen PIN vpisovalca – nič ni izbrisano' : 'Ni uspelo: ' + e.message, 'bad');
  }
};

/* ================= IZVOZ ================= */
function exportXlsx(filename, sheets) {
  if (!window.XLSX) return toast('Knjižnica za Excel se ni naložila', 'bad');
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': 'Ni podatkov' }]);
    const keys = Object.keys(rows[0] || {}); ws['!cols'] = keys.map(k => ({ wch: Math.min(50, Math.max(k.length + 2, ...rows.slice(0, 200).map(r => String(r[k] ?? '').length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const safe = filename.replace(/[\\/:*?"<>|]/g, '-');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const download = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = safe; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); };
  try {
    const file = new File([blob], safe, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: safe }).catch(e => { if (e && e.name !== 'AbortError') download(); });
      return;
    }
  } catch {}
  download();
}

/* ================= SINHRONIZACIJA ================= */
let syncing = false, lastSyncErr = '';
async function pendingCount() {
  const es = await DB.all('entries'); return es.filter(e => !e.synced).length + (await DB.count('outbox_art')) + (await DB.count('outbox_alias')) + (((await DB.kvGet('revOut')) || []).length);
}
async function updateBadge() {
  const n = await pendingCount(); const b = $('#syncBadge');
  if (!navigator.onLine) { b.className = 'sync ' + (n ? 'pend' : ''); b.textContent = n ? `Brez povezave · ${n}` : 'Brez povezave'; }
  else if (lastSyncErr) { b.className = 'sync err'; b.textContent = n ? `Napaka · ${n}` : 'Napaka'; b.title = lastSyncErr; }
  else if (n) { b.className = 'sync pend'; b.textContent = `Čaka ${n}`; }
  else { b.className = 'sync ok'; b.textContent = 'Naloženo'; }
}
$('#syncBadge').onclick = () => { if (lastSyncErr) toast(lastSyncErr, 'bad'); else sync(true); };
async function pullArticles() {
  const since = (await DB.kvGet('artSince')) || { ts: null, code: '' };
  // 2 minuti prekrivanja, da ne zgrešimo sočasnih zapisov
  let ts = since.ts ? new Date(new Date(since.ts).getTime() - 120000).toISOString() : null, code = since.ts ? '' : '';
  let last = since;
  for (let guard = 0; guard < 100; guard++) {
    const rows = await rpc('get_articles', { p_pin: S.pin, p_since: ts || '-infinity', p_after_code: code }) || [];
    if (rows.length) {
      const local = rows.map(r => ({ code: r.code, ean: r.ean, manufacturer: r.manufacturer, description: r.description, unit: r.unit, book_qty: r.book_qty, source: r.source, sort_order: r.sort_order ?? null, updated_at: r.updated_at }));
      await DB.putMany('articles', local); invalidateArts();
      const lr = rows[rows.length - 1]; ts = lr.updated_at; code = lr.code; last = { ts: lr.updated_at, code: lr.code };
    }
    if (rows.length < 5000) break;
  }
  if (last && last.ts) await DB.kvSet('artSince', last);
}
async function pullAliases() {
  const since = (await DB.kvGet('aliasSince')) || { ts: null, alias: '' };
  let ts = since.ts ? new Date(new Date(since.ts).getTime() - 120000).toISOString() : null, after = '', last = since;
  for (let guard = 0; guard < 100; guard++) {
    const rows = await rpc('get_aliases', { p_pin: S.pin, p_since: ts || '-infinity', p_after: after }) || [];
    if (rows.length) {
      await DB.putMany('aliases', rows.map(r => ({ alias: r.alias, raw: r.raw, code: r.code }))); invalidateArts();
      const lr = rows[rows.length - 1]; ts = lr.updated_at; after = lr.alias; last = { ts: lr.updated_at, alias: lr.alias };
    }
    if (rows.length < 5000) break;
  }
  if (last && last.ts) await DB.kvSet('aliasSince', last);
}
let aliasFnMissing = false;
let syncPromise = null;
function sync(manual) {
  if (syncPromise) return syncPromise.then(() => manual ? sync(true) : undefined);
  syncPromise = _sync(manual).finally(() => { syncPromise = null; });
  return syncPromise;
}
async function _sync(manual) {
  if (!S.pin) return;
  if (!navigator.onLine) { updateBadge(); if (manual) toast('Ni internetne povezave', 'bad'); return; }
  syncing = true;
  try {
    try { await applyReset(await rpc('get_reset', { p_pin: S.pin, p_popis: S.popis })); }
    catch (e) { if (/Napačen PIN/.test(e.message)) throw e; }          // posodobitev-6 še ni zagnana
    const pend = (await DB.all('entries')).filter(e => !e.synced);
    for (let i = 0; i < pend.length; i += 200) {
      const chunk = pend.slice(i, i + 200);
      await rpc('sync_entries', { p_pin: S.pin, p_entries: chunk.map(({ synced, ...rest }) => rest) });
      for (const sent of chunk) {
        const now = await DB.get('entries', sent.id);
        if (now && now.updated_at === sent.updated_at) { now.synced = true; await DB.put('entries', now); }
      }
    }
    const outbox = await DB.all('outbox_art');
    for (let i = 0; i < outbox.length; i += 500) {
      const chunk = outbox.slice(i, i + 500);
      await rpc('upsert_articles', { p_pin: S.pin, p_articles: chunk });
      for (const a of chunk) { const now = await DB.get('outbox_art', a.code); if (now && now.ts === a.ts) await DB.del('outbox_art', a.code); }
    }
    try {
      const v = await rpc('get_list_version', { p_pin: S.pin });
      const lv = await DB.kvGet('listVersion');
      if (typeof v === 'number' && lv !== v) {            // popisni list je bil izbrisan ali zamenjan
        if (lv !== undefined && lv !== null) await clearLocalList();
        await DB.kvSet('listVersion', v);
      }
    } catch (e) { if (/Napačen PIN/.test(e.message)) throw e; } // posodobitev-3 še ni zagnana
    await pullArticles();
    // povezane kode (če posodobitev-2.sql še ni zagnana, se počaka – vnosi tečejo normalno)
    try {
      const ob = await DB.all('outbox_alias');
      for (let i = 0; i < ob.length; i += 500) {
        const chunk = ob.slice(i, i + 500);
        await rpc('upsert_aliases', { p_pin: S.pin, p_aliases: chunk.map(({ ts, ...r }) => r) });
        for (const a of chunk) { const now = await DB.get('outbox_alias', a.alias); if (now && now.ts === a.ts) await DB.del('outbox_alias', a.alias); }
      }
      await pullAliases(); aliasFnMissing = false;
    } catch (e) {
      if (/Napačen PIN/.test(e.message)) throw e;
      if (!aliasFnMissing) { aliasFnMissing = true; console.warn('Povezane kode:', e.message); }
    }
    try {
      const q = (await DB.kvGet('revOut')) || [];
      while (q.length) {
        try { await sendReview(q[0]); } catch (e) { if (!/samo vpisovalec/.test(e.message)) throw e; }
        q.shift(); await DB.kvSet('revOut', q);
      }
      await pullReviews();
      if (curScreen === 'plist' && !$('#plSearch').matches(':focus')) renderPlist();
    } catch (e) { if (/Napačen PIN/.test(e.message)) throw e; } // posodobitev-4 še ni zagnana
    lastSyncErr = '';
    if (manual) toast('Vse naloženo', 'ok');
  } catch (e) {
    lastSyncErr = 'Nalaganje ni uspelo: ' + e.message;
    if (manual) toast(lastSyncErr, 'bad');
  } finally {
    syncing = false; updateBadge();
    if (curScreen === 'list') renderList();
    if (curScreen === 'plist' && !$('#plSearch').matches(':focus')) renderPlist();
  }
}
window.addEventListener('online', () => sync());
window.addEventListener('offline', updateBadge);
setInterval(() => sync(), CFG.SYNC_MS);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (curScreen === 'scan' || curScreen === 'item') stopScanner(); }
  else { if (curScreen === 'scan' && CFG.CAMERA) startScanner(); sync(); keepAwake(); }
});

/* ================= ZAGON ================= */
(async function init() {
  try { await DB.open(); }
  catch (e) { document.body.innerHTML = '<div class="pad">Lokalna baza ni dostopna (zasebni način brskalnika?). Odprite aplikacijo v običajnem oknu.</div>'; return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  S.location = ''; // lokacije se ne vpisujejo
  const sess = await DB.kvGet('session');
  if (sess && sess.name && sess.pin && sess.popis) { Object.assign(S, sess); startApp(); }
  else showLogin();
})();
</script>
